<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Data</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap {
    max-width: 500px; margin: 80px auto; padding: 30px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    text-align: center;
  }
  .wrap input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface-alt); color: var(--ink);
  }
  .wrap button {
    width: 100%; padding: 14px; margin-top: 10px;
    background: var(--gold); color: #0A0A0B; border: none; border-radius: 4px;
    font-weight: bold; cursor: pointer; font-size: 1rem;
  }
  .wrap button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 16px; font-size: .9rem; white-space: pre-line; }
  #migrateSection { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <h2 style="color:var(--gold); margin-bottom:20px;">Upload Data from data.js to firebase</h2>

  <div id="loginSection">
    <input type="email" id="emailInput" placeholder="Email">
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="login()">Sign in</button>
  </div>

  <div id="migrateSection">
    <p style="color:var(--muted); margin-bottom:16px;">
     Upload<span id="itemCount"></span> 
    </p>
    <button id="migrateBtn" onclick="migrate()">Upload Data</button>
  </div>

  <div id="msg"></div>
</div>

<script src="data.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const auth = firebase.auth();

  function login() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => {
        document.getElementById('msg').textContent = 'Wrong email or password' + err.message;
      });
  }

  auth.onAuthStateChanged(user => {
    document.getElementById('loginSection').style.display = user ? 'none' : 'block';
    document.getElementById('migrateSection').style.display = user ? 'block' : 'none';
    if (user) {
      const total = categories.reduce((sum, c) => sum + c.items.length, 0);
      document.getElementById('itemCount').textContent = total + ' Products in ' + categories.length + ' Categories';
    }
  });

  function migrate() {
    const btn = document.getElementById('migrateBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = 'Uploading data...';

    db.ref('storeConfig').set(STORE)
      .then(() => db.ref('categories').set(categories))
      .then(() => {
        msg.textContent = 'Data uploaded successfully';
      })
      .catch(err => {
        msg.textContent = 'Failed to upload data' + err.message;
      })
      .finally(() => { btn.disabled = false; });
  }
</script>
</body>
</html>
